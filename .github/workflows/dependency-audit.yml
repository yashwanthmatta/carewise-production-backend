name: Dependency audit

# Checks the Python packages the API runs with for known vulnerabilities (PyPI advisory
# database, via pip-audit). Installs the same way as the Dockerfile: upgraded pip and
# setuptools, then the project. Read-only: it changes nothing and needs no secrets.
on:
  pull_request:
    branches: [main]
    paths: ["pyproject.toml", "Dockerfile", ".github/workflows/dependency-audit.yml"]
  push:
    branches: [main]
    paths: ["pyproject.toml", "Dockerfile"]
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC: catches advisories published after a merge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install like the Dockerfile
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install .

      - name: Audit installed packages
        run: |
          python -m pip install "pip-audit==2.10.1"
          python -m pip_audit --progress-spinner off --desc on
